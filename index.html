<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>시안 기록실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page">
  <header>
    <h1>시안 기록실</h1>
    <p style="margin:6px 0 0">고르거나 확인해야 하는 시안을 모아 두는 곳이에요. 최근 시안이 위에 있어요.</p>
  </header>
  <input class="search" type="search" id="q" placeholder="시안 검색 (제목, 프로젝트, 태그, 설명)" autocomplete="off">
  <div class="bar" id="chips"></div>
  <div id="list" style="display:grid;gap:16px"></div>
  <div class="empty" id="empty" hidden>검색 결과가 없어요.</div>
  <p class="note" id="foot"></p>
</div>
<script src="data.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const M = (window.MOCKS || []).slice().sort((a, b) => (b.date + b.id).localeCompare(a.date + a.id));
const ST = { open: ['선택 필요', 'w'], done: ['선택 완료', 'k'], archive: ['보관', ''], live: ['준완성 사이트', 'k'] };
const projects = [...new Set(M.map(m => m.project))];
let st = 'all', pj = 'all', q = '';

function chosen(m) { try { return JSON.parse(localStorage.getItem('testroom.choice.' + m.id) || '{}'); } catch (e) { return {}; } }
function chip(group, id, label) {
  const b = document.createElement('button'); b.className = 'chip'; b.textContent = label; b.dataset.g = group; b.dataset.v = id;
  b.onclick = () => { if (group === 'st') st = id; else pj = id; render(); }; $('chips').append(b);
}
chip('st', 'all', '전체'); chip('st', 'open', '선택 필요'); chip('st', 'live', '준완성 사이트'); chip('st', 'done', '선택 완료'); chip('st', 'archive', '보관');
projects.forEach(p => chip('pj', p, p));

function cardHTML(m) {
  const c = chosen(m), n = (m.questions || []).filter(x => c[x.id] || (c['~' + x.id] || '').trim()).length, total = (m.questions || []).length;
  const [label, cls] = ST[m.status] || ST.open;
  const prog = total ? `<span class="tag">${n}/${total} 선택</span>` : '';
  return `<a class="card" href="${esc(m.href || 'mocks/' + m.id + '/')}"><h3>${esc(m.title)}</h3><p>${esc(m.summary || '')}</p>
    <div class="meta"><span class="tag ${cls}">${label}</span>${prog}<span>${esc(m.project)}</span><span>${esc(m.date)}</span></div>
    ${m.decided ? `<p class="note" style="margin-top:8px"><b>선택:</b> ${esc(m.decided)}${m.applied ? ' · ' + esc(m.applied) : ''}</p>` : ''}
    <div class="meta">${(m.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div></a>`;
}
function render() {
  document.querySelectorAll('#chips .chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.g === 'st' ? b.dataset.v === st : b.dataset.v === pj));
  const k = q.trim().toLowerCase();
  const items = M.filter(m => (st === 'all' || m.status === st) && (pj === 'all' || m.project === pj)
    && (!k || [m.title, m.project, m.summary, m.id, ...(m.tags || []), ...(m.questions || []).map(x => x.text)].join(' ').toLowerCase().includes(k)));
  // 선택이 필요한 시안은 위, 그 아래에 지난 시안(최신순)
  const open = items.filter(m => m.status === 'open' || m.status === 'live'), rest = items.filter(m => m.status !== 'open' && m.status !== 'live');
  let html = '';
  if (open.length) html += `<section style="display:grid;gap:12px"><div class="sec"><span>지금 볼 시안 · 사이트</span><small>${open.length}</small></div>${open.map(cardHTML).join('')}</section>`;
  if (rest.length) html += `<section style="display:grid;gap:12px"><div class="sec"><span>지난 시안</span><small>${rest.length}</small></div>${rest.map(cardHTML).join('')}</section>`;
  $('list').innerHTML = html; $('empty').hidden = items.length > 0;
  $('foot').textContent = `시안 ${M.length}개 · 선택 필요 ${M.filter(m => m.status === 'open').length}개`;
}
$('q').addEventListener('input', e => { q = e.target.value; render(); });
render();
</script>
</body>
</html>
